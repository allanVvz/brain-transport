name: release-transport
on:
  workflow_dispatch:
    inputs:
      manifest_sha: {description: Integrated manifest SHA, required: true}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs: {digest: "${{ steps.build.outputs.digest }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        id: build
        with: {context: ., file: api/Dockerfile, push: true, tags: "ghcr.io/allanvvz/brain-transport:${{ github.sha }}"}
  approve:
    needs: image
    environment: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "digest=${{ needs.image.outputs.digest }} manifest=${{ inputs.manifest_sha }}"
