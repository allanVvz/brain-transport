name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
      - run: python -m pip install -r api/requirements.txt -r api/requirements-test.txt
      - run: python -m compileall -q api
      - run: python -m json.tool SERVICE_MANIFEST.json >/dev/null
      - run: '! grep -R "SUPABASE_SERVICE_KEY" api --include="*.py"'
      - name: Service tests
        env:
          SUPABASE_OFFLINE: "true"
          KNOWLEDGE_TAXONOMY_OFFLINE: "true"
          CURRENT_SCHEMA_VERSION: "130"
        run: python -m pytest -q api/tests tests
